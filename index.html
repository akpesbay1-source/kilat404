<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tebak Skor Piala Dunia 2026</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial, sans-serif;
}

body{
  min-height:100vh;
  background:linear-gradient(135deg,#fff6d7,#ffffff,#ffe6a1);
  display:flex;
  justify-content:center;
  padding:15px;
}

.poster{
  width:390px;
  background:#fff;
  border:3px solid #e6a800;
  border-radius:22px;
  padding:18px;
  color:#10265a;
  box-shadow:0 10px 35px rgba(0,0,0,.18);
}

.logo{
  width:220px;
  display:block;
  margin:0 auto 15px;
}

.user-box{
  background:#fff9e8;
  border:2px solid #e6a800;
  border-radius:16px;
  padding:13px;
  margin-bottom:18px;
}

.user-box label{
  font-size:12px;
  font-weight:900;
  display:block;
  margin-bottom:7px;
}

.user-box input{
  width:100%;
  height:48px;
  border:2px solid #f0b400;
  border-radius:12px;
  padding:0 14px;
  font-size:15px;
  font-weight:800;
  color:#10265a;
  outline:none;
}

.title{
  text-align:center;
  font-size:32px;
  font-weight:900;
}

.subtitle{
  text-align:center;
  font-size:19px;
  font-weight:900;
  color:#d99400;
  margin-bottom:22px;
}

.match{
  background:#fffdf7;
  border:2px solid #ffd979;
  border-radius:18px;
  margin-bottom:18px;
  padding:18px 12px 15px;
  position:relative;
  box-shadow:0 6px 12px rgba(0,0,0,.08);
}

.match-label{
  position:absolute;
  top:-15px;
  left:50%;
  transform:translateX(-50%);
  background:linear-gradient(#ffd84d,#e39a00);
  color:#fff;
  padding:7px 30px;
  border-radius:0 0 15px 15px;
  font-weight:900;
  font-size:15px;
}

.teams{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-top:15px;
}

.team{
  width:38%;
  text-align:center;
}

.team img{
  width:72px;
  height:50px;
  object-fit:cover;
  border-radius:8px;
  border:2px solid #f2b300;
  margin-bottom:8px;
}

.team h3{
  font-size:15px;
  font-weight:900;
}

.vs{
  font-size:28px;
  font-weight:900;
  color:#d60000;
}

.score{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:12px;
  margin-top:14px;
}

.score input{
  width:58px;
  height:48px;
  border:2px solid #f2a900;
  border-radius:12px;
  text-align:center;
  font-size:22px;
  font-weight:900;
  color:#10265a;
  outline:none;
}

.score span{
  font-size:25px;
  font-weight:900;
  color:#9b6500;
}

.prize{
  display:flex;
  background:#fff;
  border:2px solid #e8a500;
  border-radius:18px;
  padding:15px 6px;
  text-align:center;
}

.prize-box{
  width:33.33%;
  border-right:1px solid #efc76c;
}

.prize-box:last-child{
  border-right:none;
}

.medal{
  width:38px;
  height:38px;
  background:linear-gradient(#ffe16a,#d99700);
  color:white;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  margin:0 auto 8px;
  font-weight:900;
  font-size:20px;
}

.money{
  color:#d10e0e;
  font-size:17px;
  font-weight:900;
}

.info{
  display:flex;
  gap:8px;
  margin:18px 0;
}

.info-box{
  flex:1;
  text-align:center;
  font-size:10px;
  font-weight:900;
  line-height:1.35;
}

.icon{
  width:39px;
  height:39px;
  background:#10265a;
  color:white;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  margin:0 auto 7px;
  font-size:19px;
}

button{
  width:100%;
  border:none;
  background:linear-gradient(#ffd94f,#f4a900);
  color:#10265a;
  font-size:19px;
  font-weight:900;
  padding:15px;
  border-radius:14px;
  box-shadow:0 6px 0 #b97800;
  cursor:pointer;
}

.loading{
  position:fixed;
  inset:0;
  background:rgba(255,255,255,.96);
  display:none;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  z-index:9999;
  text-align:center;
}

.loader{
  width:75px;
  height:75px;
  border:8px solid #eee;
  border-top:8px solid #f4a900;
  border-radius:50%;
  animation:spin .8s linear infinite;
}

@keyframes spin{
  to{transform:rotate(360deg);}
}

.loading h2{
  margin-top:22px;
  color:#10265a;
  font-size:24px;
}

.loading p{
  color:#555;
  margin-top:8px;
  font-weight:700;
}

.progress{
  width:280px;
  height:12px;
  background:#ddd;
  border-radius:50px;
  overflow:hidden;
  margin-top:22px;
}

#progressBar{
  width:0%;
  height:100%;
  background:linear-gradient(90deg,#f4a900,#ffd94f);
}
</style>
</head>

<body>

<div class="poster">

  <img src="https://sga-cdn-hxg6b2d7ctb2c0eu.z02.azurefd.net/agent-websites/326/medialibrary/images/326_d403d3a3233245cb950597bd295b1f98.webp" class="logo" alt="KILAT404">

  <div class="user-box">
    <label>USERNAME / ID MEMBER</label>
    <input type="text" id="username" placeholder="Masukkan username atau ID">
  </div>

  <div class="title">PIALA DUNIA 2026</div>
  <div class="subtitle">TEBAK SKOR PEREMPAT FINAL</div>

  <div class="match">
    <div class="match-label">MATCH 1</div>
    <div class="teams">
      <div class="team"><img src="https://flagcdn.com/w160/fr.png"><h3>FRANCE</h3></div>
      <div class="vs">VS</div>
      <div class="team"><img src="https://flagcdn.com/w160/ma.png"><h3>MAROCO</h3></div>
    </div>
    <div class="score"><input type="number"><span>-</span><input type="number"></div>
  </div>

  <div class="match">
    <div class="match-label">MATCH 2</div>
    <div class="teams">
      <div class="team"><img src="https://flagcdn.com/w160/es.png"><h3>SPAIN</h3></div>
      <div class="vs">VS</div>
      <div class="team"><img src="https://flagcdn.com/w160/be.png"><h3>BELGIUM</h3></div>
    </div>
    <div class="score"><input type="number"><span>-</span><input type="number"></div>
  </div>

  <div class="match">
    <div class="match-label">MATCH 3</div>
    <div class="teams">
      <div class="team"><img src="https://flagcdn.com/w160/no.png"><h3>NORWEGIA</h3></div>
      <div class="vs">VS</div>
      <div class="team"><img src="https://flagcdn.com/w160/gb-eng.png"><h3>INGGRIS</h3></div>
    </div>
    <div class="score"><input type="number"><span>-</span><input type="number"></div>
  </div>

  <div class="match">
    <div class="match-label">MATCH 4</div>
    <div class="teams">
      <div class="team"><img src="https://flagcdn.com/w160/ar.png"><h3>ARGENTINA</h3></div>
      <div class="vs">VS</div>
      <div class="team"><img src="https://flagcdn.com/w160/ch.png"><h3>SWISS</h3></div>
    </div>
    <div class="score"><input type="number"><span>-</span><input type="number"></div>
  </div>

  <div class="info">
    <div class="info-box"><div class="icon">📅</div>PREDIKSI DITUTUP<br>SEBELUM KICK-OFF</div>
    <div class="info-box"><div class="icon">🎁</div>BONUS LANGSUNG<br>DIPROSES</div>
  </div>

  <button onclick="submitPrediksi()">KIRIM PREDIKSI SEKARANG</button>

</div>

<div class="loading" id="loadingScreen">
  <div class="loader"></div>
  <h2>Mengirim Prediksi...</h2>
  <p>Mohon tunggu sebentar</p>
  <div class="progress">
    <div id="progressBar"></div>
  </div>
</div>

<script>
function submitPrediksi(){
  const username = document.getElementById("username").value.trim();

  if(username === ""){
    alert("Silakan isi Username / ID Member terlebih dahulu.");
    return;
  }

  const tujuanRedirect = "https://dub.sh/kilat404-qris";

  document.getElementById("loadingScreen").style.display = "flex";

  let progress = 0;
  const bar = document.getElementById("progressBar");

  const jalan = setInterval(function(){
    progress += 2;
    bar.style.width = progress + "%";

    if(progress >= 100){
      clearInterval(jalan);
      window.location.href = tujuanRedirect;
    }
  }, 35);
}
</script>

</body>
</html>
